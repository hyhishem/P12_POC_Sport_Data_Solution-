services:

#####################
# Kestra
######################
  kestra:
    image: kestra/kestra:latest
    container_name: kestra
    restart: always
    user: "root"
    ports:
      - "8080:8080"
    volumes:
      - ./kestra_data:/app/storage
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/kestra-wd:/tmp/kestra-wd 
    env_file:
      - .env_encoded  
    environment:
      KESTRA_CONFIGURATION: |
        kestra:
          storage:
            type: local
            local:
               base-path: "/app/storage"
          tasks:
            tmp-dir:
              path: /tmp/kestra-wd/tmp 
          local-files:
            allowed-paths:
              - "/app/storage"
              - "/app/storage/**"      
    command: server local
    depends_on:
      - redpanda
      - postgres
      - spark-master
    networks:
      - kestra-net


#####################
# Redpanda
######################
  redpanda:
    image: redpandadata/redpanda:v26.1.6
    container_name: redpanda
    restart: always
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092 
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092 # 
    ports:
      - "9092:9092"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kestra-net


  console:
    image: redpandadata/console:v3.7.2
    container_name: redpanda_console
    restart: always    
    depends_on:
      redpanda:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      KAFKA_BROKERS: redpanda:9092
    networks:
      - kestra-net



#####################
  # PostgreSQL
  ######################
  postgres:
    image: postgres:18-alpine
    container_name: postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres-init:/docker-entrypoint-initdb.d
    command:
      - postgres
      - -c
      - wal_level=logical
    networks:
      - kestra-net

  #####################
  # Metabase
  ######################
  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    networks:
      - kestra-net




#################
# Spark Master et 2 workers
######################

  spark-master:
    image: pyspark-postgresjar:latest
    container_name: spark-master
    restart: always
    hostname: spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_MASTER_HOST=spark-master
    ports:
      - "7077:7077"   
      - "7078:8080"  
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    networks:
      - kestra-net

  spark-worker-1:
    image: pyspark-postgresjar:latest
    container_name: spark-worker-1
    hostname: spark-worker-1
    restart: always       
    environment:
      - SPARK_MODE=worker 
      - SPARK_WORKER_MEMORY=1G
      - SPARK_WORKER_CORES=1
    command: >
     /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on:
      - spark-master
    networks:
      - kestra-net

  spark-worker-2:
    image: pyspark-postgresjar:latest
    container_name: spark-worker-2
    hostname: spark-worker-2
    restart: always          
    environment:
      - SPARK_MODE=worker 
      - SPARK_WORKER_MEMORY=1G
      - SPARK_WORKER_CORES=1
    command: >
     /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on:
      - spark-master
    networks:
      - kestra-net


volumes:
  redpanda_data:
  postgres_data:

networks:
  kestra-net:
    driver: bridge
    name: kestra-net
    
    
