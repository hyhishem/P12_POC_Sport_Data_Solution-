id: projet12_historique_strava
namespace: openclassroom.p12


tasks:
  - id: working_directory
    type: io.kestra.plugin.core.flow.WorkingDirectory
    inputFiles:
      script.py: file:///app/storage/scripts/producer_strava.py
      RH_Sport.csv: file:///app/storage/data/RH_Sport.csv


    tasks:

      - id: producer
        type: io.kestra.plugin.scripts.python.Commands
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
        containerImage: python-strava-pandas:1.0
        pythonVersion: "3.12"
        outputFiles:
          - output.json
        commands:
          - python script.py



      - id: insert_postgres
        type: io.kestra.plugin.jdbc.postgresql.Query
        url: jdbc:postgresql://postgres:5432/{{ secret('POSTGRES_DB')}}
        username: "{{ secret('POSTGRES_USER') }}"
        password: "{{ secret('POSTGRES_PASSWORD') }}"
        sql: |
          INSERT INTO strava.sport (
              id,
              id_salarie,
              nom,
              prenom,
              type_sport,
              start_time,
              end_time,
              duration_minutes,
              distance_m
          )
          VALUES (
              '{{ json(read(outputs.producer.outputFiles["output.json"])).id }}',
              {{ json(read(outputs.producer.outputFiles["output.json"])).id_salarie }},
              '{{ json(read(outputs.producer.outputFiles["output.json"])).Nom }}',
              '{{ json(read(outputs.producer.outputFiles["output.json"])).Prenom }}',
              '{{ json(read(outputs.producer.outputFiles["output.json"])).type_sport }}',
              '{{ json(read(outputs.producer.outputFiles["output.json"])).start_time }}',
              '{{ json(read(outputs.producer.outputFiles["output.json"])).end_time }}',
              {{ json(read(outputs.producer.outputFiles["output.json"])).duration_minutes }},
              {{ json(read(outputs.producer.outputFiles["output.json"])).distance_m ?? 'NULL' }}

          );