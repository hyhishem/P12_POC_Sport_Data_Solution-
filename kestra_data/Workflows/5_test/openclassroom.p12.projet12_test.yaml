id: projet12_test
namespace: openclassroom.p12

labels:
  strava: 006_Test

tasks:

  - id: working_directory
    type: io.kestra.plugin.core.flow.WorkingDirectory
    inputFiles:
      RH_Sport.csv: file:///app/storage/data/RH_Sport.csv

    tasks:


      - id: check_distance_rules
        type: io.kestra.plugin.scripts.python.Script
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
        containerImage: python-strava-pandas:1.0
        pythonVersion: "3.12"
        allowFailure: true
        script: |
          import pandas as pd

          df = pd.read_csv("RH_Sport.csv")

          errors = df[
              ((df["moyen_de_deplacement"] == "a_pied") & (df["distance_domicile_travail"] > 10)) |
              ((df["moyen_de_deplacement"] == "velo_trot") & (df["distance_domicile_travail"] > 25))
          ]


          if len(errors) > 0:
              raise Exception(f" {len(errors)} incoherances sur le moyen de deplacement")
          else:
            print(f"{len(errors)}incoherance sur le moyen de deplacement ")



      - id: count_oltp_vs_fact
        type: io.kestra.plugin.jdbc.postgresql.Query
        url: jdbc:postgresql://postgres:5432/{{ secret('POSTGRES_DB') }}
        username: "{{ secret('POSTGRES_USER') }}"
        password: "{{ secret('POSTGRES_PASSWORD') }}"
        fetchType: FETCH
        sql: |
          SELECT COUNT(*) 
          FROM strava.sport s
          WHERE NOT EXISTS (
              SELECT 1
              FROM dwh.fact_sport_activity f
              WHERE f.id = s.id
          );


      - id: volumetrie_source_table_de_fait
        type: io.kestra.plugin.core.execution.Fail
        allowFailure: true
        condition: "{{  outputs.count_oltp_vs_fact.rows[0].count != 0 }}"
