id: projet12_datacleaning
namespace: openclassroom.p12


tasks:
  - id: working_directory
    type: io.kestra.plugin.core.flow.WorkingDirectory
    inputFiles:
      script.py: file:///app/storage/scripts/dataclean.py
      Sport.csv: file:///app/storage/data/Sport.csv
      RH.csv: file:///app/storage/data/RH.csv


    tasks:

      - id: Data_Clean
        type: io.kestra.plugin.scripts.python.Commands
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
        containerImage: python-strava-pandas:1.0
        pythonVersion: "3.12"
        beforeCommands:
          - pip install openrouteservice
        outputFiles:
          - RH_Sport.csv  
        commands:
          - python script.py




      - id: save_clean_Data
        type: io.kestra.plugin.scripts.shell.Commands
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        env:
          KEY_API_GEO: "{{secret('KEY_API_GEO') }}"
        inputFiles:    
          RH_Sport.csv: "{{ outputs.Data_Clean.outputFiles['RH_Sport.csv'] }}"
        commands:
          - cp RH_Sport.csv  /app/storage/data/RH_Sport.csv